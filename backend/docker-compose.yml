version: "3.9"

# ── AutoML Platform — local infrastructure stack ──────────────────────────────
# Provides: PostgreSQL, Redis, MinIO
# The FastAPI app and Celery worker run locally (outside Docker) for easier dev.

services:

  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: automl_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     automl
      POSTGRES_PASSWORD: automl
      POSTGRES_DB:       automl
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U automl -d automl"]
      interval: 5s
      timeout:  5s
      retries:  10

  # ── Redis 7 ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: automl_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout:  3s
      retries:  10

  # ── MinIO (S3-compatible object storage) ───────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: automl_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test:     ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout:  5s
      retries:  10

  # ── Celery Flower (task monitor) ────────────────────────────────────────────
  flower:
    image: mher/flower:2.0
    container_name: automl_flower
    restart: unless-stopped
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
